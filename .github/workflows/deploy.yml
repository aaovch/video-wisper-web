name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '23 3 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate current report metadata
        run: npm run build-search-index

      - name: Export public analytics aggregates
        env:
          GOATCOUNTER_API_TOKEN: ${{ secrets.GOATCOUNTER_API_TOKEN }}
          GOATCOUNTER_START_DATE: '2026-10-03'
          BASE_PATH: /${{ github.event.repository.name }}
        shell: bash
        run: |
          if [ -n "$GOATCOUNTER_API_TOKEN" ]; then
            npm run analytics:export
          elif [ "${{ github.event_name }}" = "schedule" ]; then
            echo "::error::GOATCOUNTER_API_TOKEN is required for analytics refresh"
            exit 1
          else
            echo "Analytics export not configured; statistics will show unavailable data"
          fi

      - name: Validate, test and build
        env:
          # Для project-репозитория сайт публикуется по пути /<repo>/
          BASE_PATH: /${{ github.event.repository.name }}
        run: npm run qa-report -- --all

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
